<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" font-family="'Yu Gothic','YuGothic','Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect width="880" height="424" fill="#ffffff"/>

  <!-- ===== 凡例 ===== -->
  <rect x="22" y="18" width="20" height="14" fill="#dcdcdc" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="50" y="30" font-size="11" fill="#1a1a1a">固定文言　網掛け</text>

  <rect x="190" y="18" width="20" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="218" y="30" font-size="11" fill="#1a1a1a">生成文言　白抜き</text>

  <!-- ===== 見出し ===== -->
  <text x="40" y="60" font-size="10" font-weight="bold" fill="#555555">AI の発話</text>
  <text x="196" y="60" font-size="10" font-weight="bold" fill="#555555">ステージ</text>
  <text x="330" y="60" font-size="10" font-weight="bold" fill="#555555">generated</text>
  <line x1="22" y1="66" x2="430" y2="66" stroke="#1a1a1a" stroke-width="1"/>

  <!-- ===== 1 固定 ===== -->
  <rect x="22" y="72" width="408" height="40" fill="#dcdcdc" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="40" y="97" font-size="11.5" fill="#1a1a1a">1　開始の問いかけ</text>
  <text x="196" y="97" font-size="10" fill="#555555" font-family="monospace">Keep</text>
  <text x="330" y="97" font-size="10" fill="#1a1a1a" font-family="monospace">false</text>

  <!-- ===== 2-5 生成 ===== -->
  <rect x="22" y="120" width="408" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="40" y="145" font-size="11.5" fill="#1a1a1a">2　問い</text>
  <text x="196" y="145" font-size="10" fill="#555555" font-family="monospace">Problem</text>
  <text x="330" y="145" font-size="10" fill="#1a1a1a" font-family="monospace">true</text>

  <rect x="22" y="168" width="408" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="40" y="193" font-size="11.5" fill="#1a1a1a">3　問い</text>
  <text x="196" y="193" font-size="10" fill="#555555" font-family="monospace">Fact</text>
  <text x="330" y="193" font-size="10" fill="#1a1a1a" font-family="monospace">true</text>

  <rect x="22" y="216" width="408" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="40" y="241" font-size="11.5" fill="#1a1a1a">4　問い</text>
  <text x="196" y="241" font-size="10" fill="#555555" font-family="monospace">Feeling_Other</text>
  <text x="330" y="241" font-size="10" fill="#1a1a1a" font-family="monospace">true</text>

  <rect x="22" y="264" width="408" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="40" y="289" font-size="11.5" fill="#1a1a1a">5　問い</text>
  <text x="196" y="289" font-size="10" fill="#555555" font-family="monospace">Essence</text>
  <text x="330" y="289" font-size="10" fill="#1a1a1a" font-family="monospace">true</text>

  <!-- ===== 6 固定 ===== -->
  <rect x="22" y="312" width="408" height="40" fill="#dcdcdc" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="40" y="337" font-size="11.5" fill="#1a1a1a">6　締めの問い</text>
  <text x="196" y="337" font-size="10" fill="#555555" font-family="monospace">Closing_Insight</text>
  <text x="330" y="337" font-size="10" fill="#1a1a1a" font-family="monospace">false</text>

  <!-- ===== 7 生成 ===== -->
  <rect x="22" y="360" width="408" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="40" y="385" font-size="11.5" fill="#1a1a1a">7　行動計画（Try）</text>
  <text x="196" y="385" font-size="10" fill="#555555" font-family="monospace">Try_Plan</text>
  <text x="330" y="385" font-size="10" fill="#1a1a1a" font-family="monospace">true</text>

  <!-- ===== 右: 1 への注記 ===== -->
  <line x1="430" y1="92" x2="466" y2="92" stroke="#1a1a1a" stroke-width="1" marker-end="url(#a)"/>
  <text x="474" y="96" font-size="11" font-weight="bold" fill="#1a1a1a">全参加者に一字一句同じ文言</text>

  <!-- ===== 右: 2-5 をまとめる括り ===== -->
  <line x1="430" y1="140" x2="448" y2="140" stroke="#888888" stroke-width="1"/>
  <line x1="430" y1="188" x2="448" y2="188" stroke="#888888" stroke-width="1"/>
  <line x1="430" y1="236" x2="448" y2="236" stroke="#888888" stroke-width="1"/>
  <line x1="430" y1="284" x2="448" y2="284" stroke="#888888" stroke-width="1"/>
  <line x1="448" y1="140" x2="448" y2="284" stroke="#888888" stroke-width="1"/>
  <line x1="448" y1="212" x2="466" y2="212" stroke="#1a1a1a" stroke-width="1" marker-end="url(#a)"/>

  <rect x="474" y="130" width="384" height="164" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="488" y="152" font-size="11" font-weight="bold" fill="#1a1a1a">問いの生成に与える制約</text>
  <line x1="488" y1="160" x2="844" y2="160" stroke="#1a1a1a" stroke-width="1"/>
  <text x="488" y="182" font-size="10.5" fill="#1a1a1a"><tspan font-family="monospace">COMMON_SYSTEM</tspan></text>
  <text x="502" y="199" font-size="10" fill="#555555">助言の禁止・200字程度・問いは1つだけ　全ステージ共通</text>
  <text x="488" y="223" font-size="10.5" fill="#1a1a1a"><tspan font-family="monospace">STAGE_INSTRUCTIONS[stage]</tspan></text>
  <text x="502" y="240" font-size="10" fill="#555555">そのステージで何を引き出すかの役割</text>
  <text x="488" y="264" font-size="10.5" fill="#1a1a1a">Keep / Problem ＋ 対話履歴</text>
  <text x="502" y="281" font-size="10" fill="#555555">サーバーが Firestore から読み出して組み立てる</text>

  <!-- ===== 右: 6 への注記 ===== -->
  <line x1="430" y1="332" x2="466" y2="332" stroke="#1a1a1a" stroke-width="1" marker-end="url(#a)"/>
  <text x="474" y="336" font-size="11" font-weight="bold" fill="#1a1a1a">全参加者に一字一句同じ文言</text>

  <!-- ===== 右: 7 への注記 ===== -->
  <line x1="430" y1="380" x2="466" y2="380" stroke="#1a1a1a" stroke-width="1" marker-end="url(#a)"/>
  <text x="474" y="384" font-size="11" fill="#1a1a1a">学生自身の発話の再構成。新しい助言は加えない</text>

</svg>
