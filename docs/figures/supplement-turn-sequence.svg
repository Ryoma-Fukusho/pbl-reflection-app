<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="'Yu Gothic','YuGothic','Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="b" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#ffffff"/>

  <!-- ===== ライフライン ===== -->
  <rect x="35" y="26" width="130" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="100" y="49" font-size="12.5" text-anchor="middle" fill="#1a1a1a">クライアント</text>
  <line x1="100" y1="62" x2="100" y2="436" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="205" y="26" width="150" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="280" y="49" font-size="12.5" text-anchor="middle" fill="#1a1a1a">Route Handler</text>
  <line x1="280" y1="62" x2="280" y2="436" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="395" y="26" width="150" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="470" y="49" font-size="12.5" text-anchor="middle" fill="#1a1a1a">Cloud Firestore</text>
  <line x1="470" y1="62" x2="470" y2="436" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="585" y="26" width="130" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="650" y="49" font-size="12.5" text-anchor="middle" fill="#1a1a1a">Claude API</text>
  <line x1="650" y1="62" x2="650" y2="436" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- 1. クライアント → Handler -->
  <line x1="100" y1="100" x2="278" y2="100" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="189" y="93" font-size="10.5" text-anchor="middle" fill="#1a1a1a" font-family="monospace">content, composeMs, memo</text>

  <!-- 2. Handler → Firestore -->
  <line x1="280" y1="140" x2="468" y2="140" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="374" y="133" font-size="11" text-anchor="middle" fill="#1a1a1a">セッションと対話履歴を取得</text>

  <!-- 3. Firestore → Handler -->
  <line x1="470" y1="182" x2="282" y2="182" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="376" y="170" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a1a1a">対話履歴　入力文脈はこの履歴から組み立てる</text>

  <!-- 4. 分岐ノート -->
  <rect x="150" y="200" width="310" height="62" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="305" y="223" font-size="11" text-anchor="middle" fill="#1a1a1a" font-family="monospace">next = nextStage(現ステージ)</text>
  <text x="305" y="245" font-size="11" text-anchor="middle" fill="#1a1a1a">固定文言 ／ AI 生成 ／ 発話なし の3分岐</text>

  <!-- 5. Handler → Claude -->
  <line x1="280" y1="292" x2="648" y2="292" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="464" y="285" font-size="10.5" text-anchor="middle" fill="#1a1a1a" font-family="monospace">system + turns</text>

  <!-- 6. Claude → Handler -->
  <line x1="650" y1="326" x2="282" y2="326" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="466" y="319" font-size="11" text-anchor="middle" fill="#1a1a1a">生成された問い</text>

  <!-- 7. Handler → Firestore -->
  <line x1="280" y1="372" x2="468" y2="372" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#a)"/>
  <text x="374" y="365" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="bold">一括書き込み</text>
  <text x="560" y="376" font-size="10.5" fill="#1a1a1a">messages の追加と sessions の</text>
  <text x="560" y="391" font-size="10.5" fill="#1a1a1a">更新を同時に確定する</text>

  <!-- 8. Handler → クライアント -->
  <line x1="280" y1="424" x2="102" y2="424" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="191" y="417" font-size="10.5" text-anchor="middle" fill="#1a1a1a" font-family="monospace">session, messages</text>
</svg>
