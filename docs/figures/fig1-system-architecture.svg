<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 660" width="730" height="660" font-family="'Yu Gothic','YuGothic','Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif" font-size="18">
  <!-- 文字は全て 18px に統一。\columnwidth で縮小されるため横幅を詰めている -->
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect width="730" height="660" fill="#ffffff"/>

  <!-- ===== Client ===== -->
  <rect x="80" y="20" width="420" height="150" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="290" y="50" text-anchor="middle" font-weight="bold" fill="#1a1a1a">クライアント</text>

  <rect x="100" y="66" width="380" height="86" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="330" y1="66" x2="330" y2="152" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="215" y="102" text-anchor="middle" fill="#1a1a1a">対話（チャット）</text>
  <text x="215" y="130" text-anchor="middle" fill="#555555">問いと学習者の回答</text>
  <text x="405" y="116" text-anchor="middle" fill="#1a1a1a">自己内省メモ</text>

  <!-- ===== Server ===== -->
  <rect x="80" y="280" width="420" height="150" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="290" y="310" text-anchor="middle" font-weight="bold" fill="#1a1a1a">サーバー</text>

  <rect x="92" y="326" width="126" height="66" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="155" y="352" text-anchor="middle" fill="#1a1a1a">認証</text>
  <text x="155" y="378" text-anchor="middle" fill="#1a1a1a">所有者検証</text>

  <rect x="226" y="326" width="126" height="66" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="289" y="352" text-anchor="middle" fill="#1a1a1a">プロンプト</text>
  <text x="289" y="378" text-anchor="middle" fill="#1a1a1a">構築</text>

  <rect x="360" y="326" width="126" height="66" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="423" y="352" text-anchor="middle" fill="#1a1a1a">対話制御</text>
  <text x="423" y="378" text-anchor="middle" fill="#555555">ステージ遷移</text>

  <text x="290" y="418" text-anchor="middle" fill="#555555">入力文脈はサーバーが組み立てる</text>

  <!-- ===== LLM ===== -->
  <rect x="610" y="310" width="110" height="100" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="665" y="342" text-anchor="middle" font-weight="bold" fill="#1a1a1a">LLM</text>
  <text x="665" y="368" text-anchor="middle" fill="#555555">Claude</text>
  <text x="665" y="392" text-anchor="middle" fill="#555555">Sonnet 5</text>

  <!-- ===== DB ===== -->
  <rect x="80" y="530" width="420" height="110" fill="#ebebeb" stroke="#1a1a1a" stroke-width="2.2"/>
  <text x="290" y="566" text-anchor="middle" fill="#1a1a1a">データベース (Firestore)</text>
  <line x1="100" y1="584" x2="480" y2="584" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="290" y="620" text-anchor="middle" font-weight="bold" fill="#1a1a1a">クライアントからの直接アクセス不可</text>

  <!-- ===== 矢印: Client と Server ===== -->
  <line x1="230" y1="170" x2="230" y2="276" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#a)"/>
  <text x="218" y="202" text-anchor="end" font-weight="bold" fill="#1a1a1a">送信するのは今回の</text>
  <text x="218" y="226" text-anchor="end" font-weight="bold" fill="#1a1a1a">発言とメモのみ</text>
  <text x="218" y="256" text-anchor="end" fill="#1a1a1a">対話履歴は送信しない</text>

  <line x1="380" y1="280" x2="380" y2="174" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="392" y="232" fill="#1a1a1a">次の問い・Try</text>

  <!-- ===== 矢印: Server と DB ===== -->
  <line x1="200" y1="430" x2="200" y2="526" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="188" y="486" text-anchor="end" fill="#1a1a1a">対話ログの保存</text>

  <line x1="380" y1="530" x2="380" y2="434" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#a)"/>
  <text x="392" y="486" font-weight="bold" fill="#1a1a1a">対話履歴の取得</text>

  <!-- ===== 矢印: Server と LLM ===== -->
  <line x1="500" y1="340" x2="606" y2="340" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="555" y="328" text-anchor="middle" fill="#555555">プロンプト</text>
  <line x1="610" y1="384" x2="504" y2="384" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="555" y="410" text-anchor="middle" fill="#555555">生成文</text>

  <!-- ===== 遮断されている経路 ① ===== -->
  <path d="M80,110 L24,110 L24,585 L76,585" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="8 6"/>
  <circle cx="24" cy="300" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="24" y="306" text-anchor="middle" font-weight="bold" fill="#1a1a1a">1</text>
  <circle cx="24" cy="342" r="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="17" y1="335" x2="31" y2="349" stroke="#1a1a1a" stroke-width="2.6"/>
  <line x1="31" y1="335" x2="17" y2="349" stroke="#1a1a1a" stroke-width="2.6"/>

  <!-- ===== 所有者検証 ② ===== -->
  <circle cx="60" cy="440" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="60" y="446" text-anchor="middle" font-weight="bold" fill="#1a1a1a">2</text>
  <polyline points="60,426 60,404 104,404 104,392" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>

</svg>
